# CCAB Example Configuration File
# ========================================================================================
# This is an example configuration file for ccab.sh - Audiobook Conversion Script
# Copy this file to one of the following locations:
#   - ./ccab.conf (same directory as script)
#   - ~/.config/ccab/ccab.conf
#   - /etc/ccab/ccab.conf
#
# The script will search for configuration files in the order listed above.
# ========================================================================================

# ========================================================================================
# BASIC SETTINGS
# ========================================================================================

# Target bitrate for encoded audio files (8-320 kbps)
# Lower values = smaller files, higher values = better quality
TARGET_BITRATE=48

# Temporary directory for processing files
# Make sure this directory has enough space for large audiobooks
TMP_DIR="/tmp"

# Base log directory for script logs
# The script will create subdirectories here as needed
LOG_DIR="/var/log/ccab"

# Base directory for audiobook output
# Final directory structure: BASE_DIR/Genre/Author/Series/
BASE_DIR="/audio/audiobooks"

# User and group for file ownership
# Change these to match your system user/group
FILE_USER="rp01"
FILE_GROUP="admins"

# ========================================================================================
# FILE PROCESSING SETTINGS
# ========================================================================================

# Minimum file size threshold (bytes) - files smaller than this will be re-encoded
# Default: 4MB - increase if you have issues with small files
MIN_FILE_SIZE=4096000

# Temporary file names (used during processing)
# You can customize these if they conflict with existing files
TEMP_BOOK_HTML="book.html"
TEMP_BOOK_INFO="book.info"
TEMP_RICH_INFO="rich_info.txt"
TEMP_FILE_LIST="concat_files.list"
TEMP_CONCAT_MP3="concat_44k.mp3"
TEMP_DONE_LOG="done.txt"

# Default audio quality settings
DEFAULT_SAMPLE_RATE=44100
DEFAULT_CHANNELS=2

# LAME encoding parameters for CPU encoding
LAME_QUALITY=6  # Variable bitrate quality (0=best, 9=worst)
LAME_MODE="m"   # m=mono, s=stereo, j=joint stereo

# ========================================================================================
# DIRECTORY STRUCTURE AND CATEGORIES
# ========================================================================================

# Genre categories for audiobook classification
# Format: NUMBER:DISPLAY_NAME:DIRECTORY_NAME
# You can modify these categories to match your preferences
GENRE_CATEGORIES=(
    "1:Romance:Romance"
    "2:Erotica:Erotica" 
    "3:Sci-Fi:SciFi"
    "4:Fantasy:Fantasy"
    "5:Thriller:Thriller"
    "6:Misc:Misc"
)

# ========================================================================================
# API AND EXTERNAL SERVICES
# ========================================================================================

# Google Custom Search API configuration file path
# This file should contain _engine_id and _api_key variables
API_KEYS_FILE="$HOME/.config/keys"

# Bad narrators list file path
# Create this file with one narrator name per line to get warnings
BAD_NARRATORS_FILE="/var/log/ccab/bad_narrators.txt"

# Search settings
SEARCH_RESULTS_LIMIT=7  # Number of search results to display
SEARCH_TIMEOUT=30       # Timeout for search requests (seconds)

# ========================================================================================
# CUDA SETTINGS
# ========================================================================================

# CUDA acceleration preference
# auto  = detect automatically (recommended)
# true  = force enable (will fail if not available)
# false = disable CUDA, use CPU only
CUDA_PREFERENCE="auto"

# ========================================================================================
# LOGGING AND DEBUGGING
# ========================================================================================

# Enable debug output by default
DEBUG_DEFAULT=false

# Log file names (relative to LOG_DIR)
CONVERT_LOG_FILE="converted.log"
ERROR_LOG_FILE="errors.log"

# ========================================================================================
# FILE VALIDATION
# ========================================================================================

# Supported input file extensions (space-separated)
SUPPORTED_EXTENSIONS="mp3 m4a m4b flac mp4"

# Maximum file name length
MAX_FILENAME_LENGTH=255

# ========================================================================================
# NETWORK SETTINGS
# ========================================================================================

# Curl timeout settings
CURL_TIMEOUT=30      # Timeout for HTTP requests (seconds)
CURL_MAX_RETRIES=3   # Number of retry attempts

# User agent for web requests
USER_AGENT="ccab-audiobook-converter/4.0"

# ========================================================================================
# ADVANCED SETTINGS
# ========================================================================================

# Cleanup temporary files on exit
CLEANUP_ON_EXIT=true

# Verify dependencies on startup
VERIFY_DEPENDENCIES=true

# Show conversion progress
SHOW_PROGRESS=true

# Automatic metadata cleanup
AUTO_CLEANUP_METADATA=true

# ========================================================================================
# CUSTOM COMMANDS (Advanced Users Only)
# ========================================================================================

# Override default commands (leave empty to use system defaults)
# Only modify these if you have custom builds or specific requirements
FFMPEG_CMD=""
LAME_CMD=""
CURL_CMD=""

# Additional FFmpeg parameters
# These are used for CUDA and CPU encoding - modify with caution
CUDA_DECODE_PARAMS="-hwaccel cuda -hwaccel_output_format cuda"
CUDA_ENCODE_PARAMS="-c:a libmp3lame"
CPU_ENCODE_PARAMS="-codec:a libmp3lame"

# ========================================================================================
# CONFIGURATION NOTES
# ========================================================================================
#
# - All directory paths should be absolute paths (starting with /)
# - Boolean values must be either 'true' or 'false' (lowercase)
# - Numeric values should be integers only
# - File paths will be validated on startup
# - Changes to this file require restarting the script
# - For troubleshooting, set DEBUG_DEFAULT=true
#
# ========================================================================================