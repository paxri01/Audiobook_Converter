# Smart-ccab Configuration File
# Configuration for the Simple CCAB (Claude Code Audiobook) toolkit

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

## Define color outputs
C0="$(printf '\033[0;00m')"      # Reset
C1="$(printf '\033[38;5;160m')"  # Red
C2="$(printf '\033[38;5;040m')"  # Green
C3="$(printf '\033[38;5;184m')"  # Yellow
C4="$(printf '\033[38;5;032m')"  # Blue
C5="$(printf '\033[38;5;164m')"  # Purple
C6="$(printf '\033[38;5;014m')"  # Cyan
C7="$(printf '\033[38;5;070m')"  # White
C8="$(printf '\033[38;5;237m')"  # Grey
C9="$(printf '\033[38;5;240m')"  # Lt Grey

# Log directory for ccab operations
logDir="/var/log/ccab"

# Target bitrate for MP3 conversion (default: 128k)
# Valid values: 64k, 96k, 128k, 160k, 192k, 256k, 320k
targetBitrate="48k"

# Audio output channels (stereo/mono)
# stereo: 2 channels (default, normal audio experience)
# mono: 1 channel (useful for single earbud listening)
audioChannels="stereo"

# =============================================================================
# WEB SCRAPING SETTINGS
# =============================================================================

# HTML file location for web scraping (book.html file)
htmlBookFile="/tmp/book.html"

# Enable web scraping by default (true/false)
webscrapeEnabled="true"

# =============================================================================
# LOGGING SETTINGS
# =============================================================================

# Logging level controls the verbosity of output during processing
# Valid levels (from least to most verbose):
#   ERROR   - Show only error messages (critical failures)
#   WARN    - Show warnings and errors (recommended for normal use)
#   INFO    - Show informational messages, warnings, and errors (default)
#   DEBUG   - Show debug information for troubleshooting
#   TRACE   - Show detailed trace information for development
#
# Examples:
#   logLevel="ERROR"  # Minimal output, only critical failures
#   logLevel="WARN"   # Quiet operation with important warnings
#   logLevel="INFO"   # Standard operation with progress information
#   logLevel="DEBUG"  # Detailed output for troubleshooting
#   logLevel="TRACE"  # Maximum verbosity for development
logLevel="INFO"

# =============================================================================
# FILE ORGANIZATION SETTINGS
# =============================================================================

# Base directory for organized audiobook files
# Used with move modes (-m option)
AUDIOBOOK_BASE_DIR="/audio/audiobooks"

# Move modes use genre-based organization with unified pattern:
# <BASE_DIR>/<MOVE_X>/<AUTHOR_LAST, AUTHOR_FIRST>/<SERIES> ## - <TITLE>
#
# When file organization is enabled but no move mode is specified,
# the user will be prompted to select the appropriate genre category.

MOVE_1='Fantasy'
MOVE_2='SciFi'
MOVE_3='Thriller'
MOVE_4='Romance'
MOVE_5='Erotica'
MOVE_6='Misc'

# Default genre for file organization
# Used in move mode 3 and 4 directory structures
# AUDIOBOOK_DEFAULT_GENRE="Audiobook"

# Enable file organization feature (true/false)
# When enabled, allows using -m/--move options to organize files
ENABLE_FILE_ORGANIZATION="true"

# Clean up working directory after successful file organization (true/false)
CLEANUP_WORKING_DIR_AFTER_MOVE="true"

# =============================================================================
# NOTIFICATION SETTINGS  
# =============================================================================

# Enable thumbnail generation for desktop notifications (true/false)
# Requires ImageMagick to be installed
# Thumbnails are 96x96 pixel images used in desktop notifications
enableThumbnails="true"