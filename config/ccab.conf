# CCAB Configuration File
# ========================================================================================
# Configuration file for ccab.sh - Audiobook Conversion Script
# Version: 4.0
# 
# This file contains the configurable parameters currently used by the script.
# Modify these values to customize the behavior of ccab.sh for your environment.
# ========================================================================================

# ========================================================================================
# BASIC SETTINGS
# ========================================================================================

# Temporary directory for processing files
TMP_DIR="/tmp"

# User and group for file ownership
FILE_USER="rp01"
FILE_GROUP="admins"

# ========================================================================================
# FILE PROCESSING SETTINGS
# ========================================================================================

# Target bitrate for encoded audio files (8-320 kbps)
TARGET_BITRATE=48

# Minimum file size threshold (bytes) - files smaller than this will be re-encoded
MIN_FILE_SIZE=4096000

# Temporary file names (used during processing)
TEMP_BOOK_HTML="book.html"           # HTML content from web scraping
TEMP_BOOK_INFO="book.info"           # Temporary book information
TEMP_RICH_INFO="rich_info.txt"       # Rich product information
TEMP_FILE_LIST="concat_files.list"   # File concatenation list
TEMP_CONCAT_MP3="concat_44k.mp3"     # Temporary re-encoding file
TEMP_DONE_LOG="done.txt"             # Processing completion log (tracks output directory)

# ========================================================================================
# DIRECTORY STRUCTURE
# ========================================================================================

# Base directory for audiobook output
BASE_DIR="/audio/audiobooks"

# Genre categories and their corresponding directory names under BASE_DIR
# Format: NUMBER:DISPLAY_NAME:DIRECTORY_NAME
GENRE_CATEGORIES=(
    "1:Romance:Romance"
    "2:Erotica:Erotica" 
    "3:Sci-Fi:SciFi"
    "4:Fantasy:Fantasy"
    "5:Thriller:Thriller"
    "6:Misc:Misc"
)

# Example directory structure
# /audio/audiobooks/
# ├── Romance
#     ├── <AUTHOR_LAST,FIRST>
#         ├── <SERIES - TITLE>
#             ├── <DATA FILES>
# ├── Erotica
# ├── SciFi
# ├── Fantasy
# ├── Thriller
# ├── Misc

# ========================================================================================
# API AND EXTERNAL SERVICES
# ========================================================================================

# Google Custom Search API configuration file path
API_KEYS_FILE="$HOME/.config/keys"

# Bad narrators list file path
BAD_NARRATORS_FILE="/var/log/ccab/bad_narrators.txt"

# Number of search results to display
SEARCH_RESULTS_LIMIT=7

# ========================================================================================
# CUDA SETTINGS
# ========================================================================================

# CUDA acceleration preference (auto, true, false)
# auto = detect automatically (recommended)
# true = force enable (will fail if not available)
# false = disable CUDA, use CPU only
CUDA_PREFERENCE="auto"

# ========================================================================================
# LOGGING AND DEBUGGING
# ========================================================================================

# Base log directory for script logs
LOG_DIR="/var/log/ccab"

# Log file name for converted books (relative to LOG_DIR)
CONVERT_LOG_FILE="converted.log"

# Enable debug output by default (true/false)
DEBUG_DEFAULT=false